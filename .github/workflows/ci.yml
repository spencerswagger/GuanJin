name: ci

# 门禁即承诺：三闸（go vet / go test / vue-tsc）任何一项红都不许合入。
# 说明：
#   - 迁移不在此跑 —— 项目未上线，schema 由本地/发布 Job 手动 `migrate up`（decisions.md P1）；
#   - **判定类 job 一律只读**：gofmt 只用 `-l` 列出、绝不 `-w`（否则一键把红改绿，闸失效）；
#   - **-race 不进主闸**：`-race` 需要 cgo，与项目 `CGO_ENABLED=0` 口径冲突，单列 `race` job。
#   - **integration 真跑真依赖**（Gate 口径「SKIP = 未验证 = 红」）：`integration` job 用 `postgres:16`
#     + `redis:7` 两个 service → `golang-migrate up`（手动式，decisions.md P1 明确**不做**应用内自动迁移）
#     → schema 断言 → `go test -tags=integration`；**不许 `t.Skip`、不许条件跳过**。
#   - Redis 不能只是「service 起来了」：账号级失败计数（D3-D）/ 实时撤销 / jti 防重放都落在真 Redis 上。
#     故 integration job 在测试后必须看到 **AC-LOGIN-03（直接读 D3-D 冻结键）的 PASS 行**，
#     并比对 `INFO stats.total_commands_processed` 的增量；任一不满足即判红（真 Redis 未被使用 = 未验证 = 红）。
#   - migrate CLI 版本**单一来源** = Makefile 的 `MIGRATE_VERSION`（v4.19.1）：job 里跑 `make migrate-tool`
#     装到 `./bin`，迁移命令走 `make migrate-up`，顺带把「PATH 找不到 migrate → 回退 ./bin/migrate」这条回退路径在 CI 里验到。
#   - **合并门禁包含 integration**：`go` / `race` / `web` / `integration` / `sdk` / `vuln` 六个 job 全绿才许合入 main。
#   - **vuln 是 AC-ENG-07 的依赖漏洞门禁，零网络**：数据是入库的离线快照 `docs/qa/vuln-advisories.tsv`
#     （生产者 `scripts/vuln-snapshot-refresh.py`，需要外网、**只在有网环境手动跑**），
#     判定引擎 `scripts/vuln-gate.py` 是纯 python3 标准库 → 本 job **不装包、不拉库、不访问外网**。
#     不用 govulncheck/trivy 现跑的原因：它们要 `vuln.go.dev` / `ghcr.io`（本仓 runner 解析不到外网源，
#     见 integration job 的 apt 事故），跑不起来就跳过 = 把门禁关掉。fail-closed 不看"有没有跑"，
#     而是看"数据是否新鲜 + 命中是否为空"：快照过期、白名单过期/失效、依赖版本不可解析 → 全判红。
#   - **sdk 是 Java 8 双门禁**（docs/sdk-contract.md §5.1.1）：JDK 17 走 release=8 + **真实 JDK 8** 各跑一遍；
#     `jti` 防重放**必须连真 Redis**（不许 mock），有 SKIP 即红。

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt（只读，列出即失败）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "[FAIL] gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test（主闸，不带 -race；-count=1 不吃缓存、-v 可数 PASS/SKIP）
        run: go test ./... -count=1 -v -coverprofile=cover.out | tee go-test.log
      - name: test summary（证据行 tests_run/skips）
        run: ./scripts/test-summary.sh go-test.log | tee summary.txt
      - name: coverage gate
        run: COVERAGE_PROFILE=cover.out COVERAGE_MIN=60 ./scripts/coverage-gate.sh
      - name: gates (forbidden patterns)
        run: |
          ./scripts/check-no-automigrate.sh
          ./scripts/check-forbidden-error-codes.sh
          # AC-DP-11：数据面不越界（TLS/WAF/LB/灰度/熔断/服务发现）+ 依赖清单；
          # --self-test 自带"注入必红"，脚本存在不算通过。
          ./scripts/check-dataplane-boundaries.sh --self-test
          # AC-AUD-12⑤：全仓算法扫描（SHA 系/RSA 零使用，唯一白名单 PKCE S256）。
          # --self-test 会在临时树里注入五类违规，每一次都必须被点名检出（脚本存在 ≠ 门禁存在）。
          ./scripts/check-guomi-algorithms.sh --self-test

  race:
    # 独立的竞态检测 job：-race 需要 cgo，故这里显式 CGO_ENABLED=1；
    # **不并入**上面的主闸，避免「主闸要求 CGO_ENABLED=0」与「-race 要 cgo」互相打架。
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go test -race（独立 job；同样 -count=1 不吃缓存）
        run: go test ./... -count=1 -race

  integration:
    # 真库验收：唯一权威环境（Gate §9）。没有它，「DB 类断言」等于未验证。
    # 本机无 docker 时集成测试**只在 CI 跑**，本地不跑也不跳过（跳过＝未验证＝红）。
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GUANJIN_TEST_DSN: postgres://guanjin:guanjin@localhost:5432/guanjin_test?sslmode=disable
      # 账号级失败计数（D3-D）的权威存储在 Redis，AC-LOGIN-03 的两个冻结键只能在真 Redis 上断言。
      GUANJIN_TEST_REDIS_ADDR: localhost:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guanjin
          POSTGRES_PASSWORD: guanjin
          POSTGRES_DB: guanjin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guanjin -d guanjin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: 客户端工具解析（零网络：镜像自带 或 docker exec 进 service 容器）
        # 2026-11-11 实测（run 43050572912）：runner 解析不到 azure.archive.ubuntu.com，
        # `apt-get install postgresql-client redis-tools` 重试约 4 分钟后
        # `E: Unable to fetch some archives`（exit 100）→ 本步红 → 后面 migrate/schema/集成用例整片 skipped。
        # **skipped 不是绿**，所以不再在跑测试的路径上装包：工具要么用镜像自带，
        # 要么 `docker exec` 进 job service 容器（services 本来就在 runner 的 docker daemon 上）。
        # 两条都走不通 → 脚本 exit 1（fail-closed），不许静默跳过。
        run: |
          set -euo pipefail
          # 解析逻辑自身先过自测（三条分支：缺工具→shim / 自带→零 shim / 双缺→必红）
          bash scripts/ci-integration-deps.sh --self-test
          bash scripts/ci-integration-deps.sh
      - name: 等依赖就绪（PG + Redis；healthcheck 之外再确认一次）
        run: |
          set -euo pipefail
          # 脚本是子进程，PATH 不回流；shim 目录固定为 $RUNNER_TEMP/ci-deps-bin
          export PATH="${RUNNER_TEMP}/ci-deps-bin:$PATH"
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U guanjin -d guanjin_test; then echo "[OK] postgres ready"; break; fi
            echo "waiting postgres ($i/30)"; sleep 2
          done
          pg_isready -h localhost -p 5432 -U guanjin -d guanjin_test || { echo "[FAIL] postgres 未就绪"; exit 1; }
          for i in $(seq 1 30); do
            if [ "$(redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null)" = "PONG" ]; then echo "[OK] redis ready"; break; fi
            echo "waiting redis ($i/30)"; sleep 2
          done
          [ "$(redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null)" = "PONG" ] || { echo "[FAIL] redis 未就绪"; exit 1; }
      - name: 安装 golang-migrate（版本单一来源 = Makefile 的 v4.19.1；装到 ./bin，不回 PATH）
        run: |
          # 刻意**不**把 ./bin 加进 PATH：迁移命令走 `make migrate-*`，由 Makefile 回退到 ./bin/migrate。
          # 版本证据看二进制 build info 的 mod 行（`migrate -version` 不带 ldflags 只会打印 dev）。
          make migrate-tool
      - name: migrate up（P1：手动执行；失败即红）
        run: |
          make migrate-up DATABASE_URL="$GUANJIN_TEST_DSN"
          make migrate-version DATABASE_URL="$GUANJIN_TEST_DSN"
      - name: schema 断言（15 张表 / flows 13 列 / 5 具名索引 / I-F1 CHECK / ttl seed）
        env:
          PGPASSWORD: guanjin
        run: |
          set -euo pipefail
          q() { psql -h localhost -U guanjin -d guanjin_test -tAc "$1"; }
          # 15 张逻辑表 + audit_logs 的月分区（audit_logs_pYYYYMM，属 BASE TABLE 但不算逻辑表）
          EXP="audit_logs auth_events authenticators challenges clients flows identifiers login_policies policy_snapshots role_bindings runtime_config sessions signing_keys user_visited_clients users"
          all=$(q "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations' ORDER BY 1;")
          logical=$(echo "$all" | grep -vE '^audit_logs_p[0-9]{6}$' | sed '/^$/d')
          parts=$(echo "$all" | grep -cE '^audit_logs_p[0-9]{6}$' || true)
          n=$(echo "$logical" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "logical_tables=$n audit_logs_partitions=$parts"
          echo "$logical" | tr '\n' ' '; echo
          [ "$n" = "15" ] || { echo "[FAIL] 期望 15 张逻辑表，实际 $n"; exit 1; }
          for t in $EXP; do echo "$logical" | grep -qx "$t" || { echo "[FAIL] 缺表：$t"; exit 1; }; done
          extra=$(echo "$logical" | grep -vxE "$(echo $EXP | tr ' ' '|')" || true)
          [ -z "$extra" ] || { echo "[FAIL] 出现未登记的额外表：$extra"; exit 1; }
          [ "$parts" -ge 1 ] || { echo "[FAIL] audit_logs 无月分区（D4-C 要求按月分区）"; exit 1; }
          col=$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='flows';")
          echo "flows_columns=$col"; [ "$col" = "13" ] || { echo "[FAIL] flows 期望 13 列，实际 $col"; exit 1; }
          # 5 条具名索引（D5「第二段清理索引裁定」：4 条 + flows_expired_cleanup_idx，由 000016 引入）
          idx=$(q "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='flows' AND indexname IN ('flows_one_active_per_user_client_uniq','flows_session_idx','flows_expires_idx','flows_client_created_idx','flows_expired_cleanup_idx');")
          echo "flows_named_indexes=$idx"; [ "$idx" = "5" ] || { echo "[FAIL] flows 具名索引期望 5，实际 $idx"; exit 1; }
          chk=$(q "SELECT count(*) FROM pg_constraint WHERE conname='flows_completed_requires_user';")
          echo "flows_if1_check=$chk"; [ "$chk" = "1" ] || { echo "[FAIL] 缺 I-F1 CHECK"; exit 1; }
          ttl=$(q "SELECT value FROM runtime_config WHERE key='flow.ttl_seconds';")
          echo "ttl_seed=$ttl"; [ "$ttl" = "600" ] || { echo "[FAIL] flow.ttl_seconds seed 期望 600，实际 $ttl"; exit 1; }
          # D14①：挑战配置的两键与"单一来源"不变式（000018 的核心，不靠 e2e 兜）
          cttl=$(q "SELECT value FROM runtime_config WHERE key='challenge.ttl_seconds';")
          echo "challenge_ttl_seed=$cttl"; [ "$cttl" = "300" ] || { echo "[FAIL] challenge.ttl_seconds seed 期望 300，实际 $cttl"; exit 1; }
          cmax=$(q "SELECT value FROM runtime_config WHERE key='challenge.max_attempts';")
          echo "challenge_max_attempts_seed=$cmax"; [ "$cmax" = "5" ] || { echo "[FAIL] challenge.max_attempts seed 期望 5，实际 $cmax"; exit 1; }
          cdef=$(q "SELECT coalesce(column_default,'<NULL>') FROM information_schema.columns WHERE table_schema='public' AND table_name='challenges' AND column_name='max_attempts';")
          echo "challenges_max_attempts_default=$cdef"; [ "$cdef" = "<NULL>" ] || { echo "[FAIL] challenges.max_attempts 不得有 DB 默认值（D14①），实际 $cdef"; exit 1; }
          # D21：AC-REG-04 的耗时阈值键（判据参数；服务不读、由 e2e 查库读取）
          rtim=$(q "SELECT value FROM runtime_config WHERE key='register.timing.max_diff_ms';")
          rtyp=$(q "SELECT value_type FROM runtime_config WHERE key='register.timing.max_diff_ms';")
          echo "register_timing_key=$rtim type=$rtyp"
          [ "$rtim" = "50" ] || { echo "[FAIL] register.timing.max_diff_ms seed 期望 50（D21，迁移 000019），实际 '$rtim'"; exit 1; }
          [ "$rtyp" = "int" ] || { echo "[FAIL] register.timing.max_diff_ms 的 value_type 必须是 int（D21），实际 '$rtyp'"; exit 1; }
          # D22：平台级禁用集的载体行必须存在、且是 jsonb 空数组（并发 FOR UPDATE 的前提）
          fdis=$(q "SELECT value::text FROM runtime_config WHERE key='factors.disabled';")
          ftyp=$(q "SELECT value_type FROM runtime_config WHERE key='factors.disabled';")
          fjt=$(q "SELECT jsonb_typeof(value) FROM runtime_config WHERE key='factors.disabled';")
          echo "factors_disabled_seed=$fdis type=$ftyp jsonb_typeof=$fjt"
          [ "$fdis" = "[]" ] || { echo "[FAIL] factors.disabled seed 期望 jsonb 空数组 []（D22，迁移 000020），实际 '$fdis'"; exit 1; }
          [ "$ftyp" = "json" ] || { echo "[FAIL] factors.disabled 的 value_type 必须是 json（D22），实际 '$ftyp'"; exit 1; }
          [ "$fjt" = "array" ] || { echo "[FAIL] factors.disabled 的值必须是 jsonb array（D22 禁 null/{}），实际 jsonb_typeof='$fjt'"; exit 1; }
      - name: 迁移往返（AC-ENG-02 的 down 半边：up → down -all → up → down -all）
        # 判据原文「migrate up 全绿、down 可回滚」——此前只跑了 up，「可回滚」无证据。
        # 用**专用库**（本步自建自删），不碰 guanjin_test，故不影响上面的 schema 断言与下面的集成用例。
        # 断言四条：up 到最新版本；down -all 后零残留（表/列/索引/触发器/约束/函数/序列全清）；
        #   再 up 的结构快照与第一次逐字节相同；再 down -all 仍零残留。任一不满足即 [FAIL] + exit 1。
        env:
          ROUNDTRIP_ADMIN_DSN: postgres://guanjin:guanjin@localhost:5432/postgres?sslmode=disable
          ROUNDTRIP_DSN: postgres://guanjin:guanjin@localhost:5432/guanjin_miground?sslmode=disable
        run: bash scripts/verify-migrate-roundtrip.sh
      - name: Redis 真连接基线（记录命令计数，供测试后比对增量）
        run: |
          set -euo pipefail
          pong=$(redis-cli -h 127.0.0.1 -p 6379 ping)
          echo "redis_ping=$pong"; [ "$pong" = "PONG" ] || { echo "[FAIL] Redis 不可达"; exit 1; }
          n=$(redis-cli -h 127.0.0.1 -p 6379 info stats | tr -d '\r' | sed -n 's/^total_commands_processed://p')
          [ -n "$n" ] || { echo "[FAIL] 读不到 INFO stats.total_commands_processed"; exit 1; }
          echo "$n" > "$RUNNER_TEMP/redis-cmd-baseline"
          echo "redis_commands_before=$n"
      - name: 集成测试（-tags=integration；无集成用例 = 红、有 SKIP = 红、有例即真跑）
        run: |
          set -euo pipefail
          # ①「无集成用例」必须红：0 条真连库用例 = 未验证 = 红（普通单测不能冒充）
          tagged=$(grep -rl --include='*_test.go' '^//go:build integration' . | wc -l | tr -d ' ')
          echo "integration_tagged_files=$tagged"
          [ "$tagged" -gt 0 ] || { echo "[FAIL] 无 //go:build integration 用例文件 → 0 条真连库用例 = 未验证 = 红"; exit 1; }
          # ② 只认「带标签才存在」的用例：tag 集合 - 无 tag 集合 的差集必须 > 0
          #    （不强制命名前缀，避免要求他人改测试名；纯靠构建标签判定）
          go test -tags=integration -list '.*' ./... 2>/dev/null | grep -E '^(Test|Example|Benchmark)' | sort -u > /tmp/all.txt || true
          go test -list '.*' ./... 2>/dev/null | grep -E '^(Test|Example|Benchmark)' | sort -u > /tmp/plain.txt || true
          extra=$(comm -23 /tmp/all.txt /tmp/plain.txt | wc -l | tr -d ' ')
          echo "integration_only_cases=$extra (all=$(wc -l < /tmp/all.txt | tr -d ' ') plain=$(wc -l < /tmp/plain.txt | tr -d ' '))"
          [ "$extra" -gt 0 ] || { echo "[FAIL] 没有任何「仅带 integration 标签才出现」的用例 → 视为未验证 = 红"; exit 1; }
          # ③ 真跑并留证据；SKIP/失败/缓存/空跑一律由 test-summary.sh 判红
          go test -tags=integration ./... -count=1 -v | tee integration-test.log
          ./scripts/test-summary.sh integration-test.log | tee integration-summary.txt
      - name: 审计并发串行套件（-tags 'integration audit_serial'，-p 1；探针敏感性必须在包内独占跑）
        run: |
          set -euo pipefail
          # `AC-AUD-04`（100 并发写不断链）、串行零分叉、b1/b2（删锁反证）依赖**稳定的全局链尾**，
          # 多包并行时语义不可解释（其它包会同时写同一张 audit_logs）。故单列、串行、`-p 1 -count=3`。
          go test -tags 'integration audit_serial' ./internal/audit -p 1 -count=3 -v | tee audit-serial.log
          ./scripts/test-summary.sh audit-serial.log | tee audit-serial-summary.txt
          grep -Eq '^--- PASS: TestAC_AUD_04_Concurrent100AppendsKeepChainIntact' audit-serial.log \
            || { echo "[FAIL] 串行套件里没有 AC-AUD-04 的 PASS 行 → 记账依据缺失 = 红"; exit 1; }
          grep -Eq '^--- PASS: TestAppendB2BothLocksRemovedMustFork' audit-serial.log \
            || { echo "[FAIL] b2（删两道锁必出分叉）没跑过 → 探针敏感性未验证 = 红"; exit 1; }

      - name: Redis 真连接断言（integration 期间必须真读过 Redis，否则判红）
        run: |
          set -euo pipefail
          # ① 语义证明（主判据）：AC-LOGIN-03 用例在跑完后用真 Redis 连接读 D3-D 的两个冻结键，
          #    Redis 不可达时它会 t.Fatalf("读 Redis 状态…") → 这里必须看到它的 PASS 行。
          if ! grep -Eq '^--- PASS: TestE2E_AC_LOGIN_03_Lockout' integration-test.log; then
            echo "[FAIL] 集成日志里没有 AC-LOGIN-03 的 PASS 行 → 真 Redis 未被读到 = 未验证 = 红"; exit 1
          fi
          grep -E '^--- PASS: TestE2E_AC_LOGIN_03_Lockout' integration-test.log
          # ② 环境证明（辅判据）：命令数增量。基线在测试前采集；本步骤自身会贡献 2 条命令
          #    （INFO + DBSIZE），故阈值取 3——低于它就说明测试期间几乎没和 Redis 打过交道。
          before=$(cat "$RUNNER_TEMP/redis-cmd-baseline")
          after=$(redis-cli -h 127.0.0.1 -p 6379 info stats | tr -d '\r' | sed -n 's/^total_commands_processed://p')
          delta=$((after - before))
          dbsize=$(redis-cli -h 127.0.0.1 -p 6379 dbsize)
          echo "redis_commands_before=$before after=$after delta=$delta dbsize_after=$dbsize"
          [ "$delta" -ge 3 ] || { echo "[FAIL] integration 期间 Redis 命令数几乎无增长（delta=$delta）→ 真 Redis 未被使用 = 未验证 = 红"; exit 1; }
      - name: 审计串行套件覆盖率（与并行 profile 并集判定，避免"搬用例"被误读为覆盖下降）
        run: |
          set -euo pipefail
          go test -tags 'integration audit_serial' ./internal/audit -p 1 -count=1 \
            -coverprofile=audit-serial-cover.out > audit-serial-cover.log 2>&1 || { tail -40 audit-serial-cover.log; exit 1; }
          echo "[OK] audit_serial profile: $(wc -l < audit-serial-cover.out) blocks"

      - name: 集成覆盖率采集（integration profile；供 flowstore 85% 判定）
        run: |
          set -euo pipefail
          # 与上一步同一批用例再次编译执行，只是多产出一份 profile。
          # **刻意不加 -coverpkg**：加了以后每个测试二进制都会为所有包各写一份块记录，
          # 同一代码块在 profile 里重复出现（多数 count=0），coverage-gate 的逐模块分母被放大，
          # 实测会把 flowstore 从 85% 误判成 6%。默认模式（各包自己的测试）才是口径正确的做法：
          # flowstore 的用例本身带 //go:build integration，故本 profile 里它有真实语句与覆盖。
          go test -tags=integration ./... -count=1 -coverprofile=integration-cover.out
          echo "[OK] integration-cover.out 已生成（$(wc -l < integration-cover.out | tr -d ' ') 行）"
      - name: 集成覆盖率门禁（flowstore 85% 在此判定；unit profile 判不了）
        run: |
          set -euo pipefail
          # 并行 profile + 串行套件 profile **并集**判定（`internal/audit` 的用例分两套标签）。
          COVERAGE_TAGS=integration COVERAGE_PROFILE=integration-cover.out \
            COVERAGE_EXTRA_PROFILE=audit-serial-cover.out COVERAGE_MIN=60 \
            ./scripts/coverage-gate.sh | tee integration-coverage.txt

  vuln:
    # AC-ENG-07：依赖漏洞门禁（**零网络**）。判据原文「govulncheck / trivy 必须真跑，发现 HIGH/CRITICAL 判红」；
    # 本 job 用「离线快照 + 本地判定」实现同一判据（口径与理由见 ci.yml 顶部与 docs/qa/vuln-scan.md）：
    #   - 数据：docs/qa/vuln-advisories.tsv（OSV 快照，PR 里可评审；`generated_at` 过期即红）
    #   - 判定：scripts/vuln-gate.py（纯 python3 标准库；Go 命中即红、npm/Maven HIGH/CRITICAL 红）
    #   - **三生态齐判（D23③②，2026-11-13 起）**：sdk/java 不再 [UNCOVERED]——本 job 消费
    #     `sdk` job 产出的 CycloneDX 聚合 BOM artifact（`needs: sdk` 保证同 run 内可用；
    #     artifact 锚定本次 commit，缺失或不符 = 未验证 = 红）。**artifact 缺失本步必红**。
    #   - 本 job **不装任何工具、不访问外网**（python3 是 runner 镜像自带；artifact 拉取是 Actions 内部通道）
    # 刻意**不用** actions/setup-go：本 job 不需要 Go 工具链，也就不需要下载工具链。
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载 sdk job 的 SBOM artifact（本次 run 内产出；找不到 = sdk job 没传 = 红）
        uses: actions/download-artifact@v4
        with:
          name: sdk-java-bom
          path: sbom-artifact
      - name: artifact 锚定本次 commit（D23③②：早于本次 commit 的 SBOM = 未验证 = 红）
        run: |
          set -euo pipefail
          bom=sbom-artifact/bom.json
          [ -f "$bom" ] || { echo "[FAIL] SBOM artifact 缺失（sdk job 未产出/未上传）= 未验证 = 红"; exit 1; }
          anchored="$(cat sbom-artifact/bom-commit.txt)"
          echo "bom_commit=$anchored this_commit=$GITHUB_SHA"
          [ "$anchored" = "$GITHUB_SHA" ] || { echo "[FAIL] SBOM 不是本次 commit 产出（$anchored ≠ $GITHUB_SHA）= 未验证 = 红"; exit 1; }
      - name: python3 版本（证据行：引擎只依赖标准库）
        run: python3 -VV
      - name: 依赖漏洞门禁（fail-closed；日志即合入证据；三生态 Go+npm+Maven）
        # 断言不是"脚本退出 0"就够：必须看到**扫描统计行**（证明三个生态都真扫了坐标），
        # 且**不得出现任何 [UNCOVERED] 行**（三生态齐判后，未覆盖 = 红，D23③②）。
        run: |
          set -euo pipefail
          ./scripts/check-vuln.sh --java-bom sbom-artifact/bom.json | tee vuln-gate.log
          grep -qE '^\[OK\] 依赖漏洞门禁通过：扫描 [0-9]+ 个依赖坐标（Go [1-9][0-9]* / npm [1-9][0-9]* / Maven [1-9][0-9]*）' vuln-gate.log \
            || { echo "[FAIL] 三个生态必须都扫到坐标，否则该生态等于没扫 = 红"; cat vuln-gate.log; exit 1; }
          if grep -q '^\[UNCOVERED\]' vuln-gate.log; then
            echo "[FAIL] 出现 [UNCOVERED] 行 → 有生态未纳入判定（D23③②：sdk/java 必须经 SBOM 覆盖）= 红"
            grep '^\[UNCOVERED\]' vuln-gate.log; exit 1
          fi
      - name: 正控/负控（临时夹具注入已知漏洞依赖 → 必须判红并点名 文件:行号）
        # 脚本存在 ≠ 门禁存在：35 项自检覆盖"判红/点位/版本敏感/白名单五态/快照七态/坐标漂移/解析失败"，
        # 以及 Maven/BOM 七态（命中红/修复版绿/无 BOM 显式 UNCOVERED/缺失红/坏 JSON 红/0 组件红/白名单作用域）。
        run: |
          set -euo pipefail
          ./scripts/check-vuln.sh --self-test | tee vuln-selftest.log
          # 自洽校验：逐项 OK 行数必须等于汇总行声明的项数，且**恰为 35 项**（防"把用例删掉让自己变绿"；
          # 上限取下界：加用例要同步改这个数字，比"能静默删掉三项"划算）。
          ok_n=$(grep -c '^  \[OK\] self-test/' vuln-selftest.log || true)
          [ "$ok_n" -eq 35 ] || { echo "[FAIL] 自检跑了 $ok_n 项，应为 35 项：用例被删或加用例没同步改了红线 = 红"; exit 1; }
          grep -qE "^\[OK\] 漏洞门禁自检 ${ok_n} 项全过" vuln-selftest.log \
            || { echo "[FAIL] 汇总行声明的项数（${ok_n} 项的 OK 行）对不上 = 红"; exit 1; }

  sdk:
    # Java 8 SDK（sdk/java）：单测 + **真 Redis** 集成用例 + Java 8 机械门禁。
    # 双 JDK 是契约要求：release=8 挡 API 面，真实 JDK 8 挡"用 17 编、目标 8"的虚假安全感。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: mvn -Pintegration verify（单测 + 真 Redis 集成）
        env:
          GUANJIN_TEST_REDIS_ADDR: localhost:6379
          GUANJIN_TEST_REDIS_PASSWORD: ''
        run: mvn -B -f sdk/java/pom.xml -Pintegration verify
      - name: 证据：tests_run / tests_skip（SKIP 必须为 0）+ 集成用例必须真跑
        run: |
          set -euo pipefail
          files="$(ls sdk/java/*/target/surefire-reports/*.txt sdk/java/*/target/failsafe-reports/*.txt 2>/dev/null || true)"
          [ -n "$files" ] || { echo "[FAIL] 没有任何测试报告 → 未验证 = 红"; exit 1; }
          run=0; skip=0
          for f in $files; do
            line="$(grep -h 'Tests run:' "$f" | head -1)"
            r="$(printf '%s' "$line" | sed -E 's/Tests run: ([0-9]+).*/\1/')"
            s="$(printf '%s' "$line" | sed -E 's/.*Skipped: ([0-9]+).*/\1/')"
            run=$((run + r)); skip=$((skip + s))
          done
          it="$(ls sdk/java/*/target/failsafe-reports/*.txt 2>/dev/null | wc -l | tr -d ' ')"
          echo "tests_run=$run tests_skip=$skip failsafe_reports=$it"
          [ "$skip" = "0" ] || { echo "[FAIL] 存在 SKIP（未验证 = 红）"; exit 1; }
          [ "$it" -gt 0 ] || { echo "[FAIL] 没有集成用例报告 → 视为未验证 = 红"; exit 1; }
      - name: Java 8 机械门禁（core 依赖树 / 14 条禁用 API / class 版本）
        run: ./scripts/check-sdk-java8.sh
      - name: 生成 SBOM（D23②：显式 goal，**不绑 phase** → 默认构建零变化；复用本步已热的 ~/.m2）
        # cyclonedx-maven-plugin 2.8.0 的 goal 标 @RequiresOnline：生成要联网（Maven Central 拉插件），
        # 这正是 sdk job —— `mvn verify` 刚拉完依赖，仓库已热。生成的是 CycloneDX 1.5 **聚合** BOM。
        if: matrix.java == '8'
        run: |
          set -euo pipefail
          mvn -B -q -f sdk/java/pom.xml cyclonedx:makeAggregateBom
          bom=sdk/java/target/bom.json
          [ -f "$bom" ] || { echo "[FAIL] cyclonedx:makeAggregateBom 未产出 $bom"; exit 1; }
          # 结构断言：specVersion 1.x + 第三方组件 ≥ 1（自有模块 com.guanjin:* 由消费端排除，这里也先验）
          python3 - "$bom" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          spec = d.get("specVersion", "")
          assert spec.startswith("1."), "specVersion 非 1.x: %r" % spec
          own = ((d.get("metadata") or {}).get("component") or {}).get("group") or ""
          comps = d.get("components") or []
          third = [c for c in comps if (c.get("group") or "") != own]
          print("spec=%s components=%d third_party=%d" % (spec, len(comps), len(third)))
          assert len(third) > 0, "BOM 里 0 个第三方组件 → 扫描面为空"
          PYEOF
          # commit 锚（D23③②）：artifact 缺失或**早于本次 commit** = 未验证 = 红；vuln job 逐字节核对。
          echo "$GITHUB_SHA" > sdk/java/target/bom-commit.txt
      - name: 上传 SBOM artifact（vuln job 消费；只 '8' 这条腿传，避免 matrix 同名冲突）
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-java-bom
          path: |
            sdk/java/target/bom.json
            sdk/java/target/bom-commit.txt
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: vue-tsc --noEmit + 真构建（只读判定 + vite build）
        # `npm run build` = `vue-tsc --noEmit && vite build`：只跑类型检查兜不住 vite/esbuild 的
        # 构建器升级（D23② 的"npm run build（web 自动兜）"此前没兜——CI 里从没有 vite build）。
        run: npm run build
