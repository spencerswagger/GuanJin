name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build / test / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt failed for:"; echo "$files"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          install-mode: goinstall

      - name: Guard (no AutoMigrate / soft delete / factor type branches)
        run: bash scripts/check-no-automigrate.sh

      - name: Unit tests (no Docker required)
        run: go test ./... -race -coverprofile=cover.out

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/guanjind ./cmd/guanjind
          CGO_ENABLED=0 go build -trimpath -o bin/guanjingw ./cmd/guanjingw

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
