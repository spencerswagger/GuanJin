# 关津 SDK 内置授权模型（契约 GJ-CAP-12 / 配置 #17，默认 classpath:/guanjin/model.conf）
#
# 口径（docs/baseline/GuanJin-权限模型设计.md §3.4）：**一个 model.conf，三层能力逐层生效**。
#   - 本文件承载「RBAC with resource roles」这一层（基线点名"100 个系统里 90 个这么玩"）；
#   - 行级（GJ-CAP-15 `Authz.checkRow`）与密级（GJ-CAP-16 `Authz.checkLabel`）是**独立入口**，
#     由业务在调用点显式调用（基线 §2.1 的示例代码就是这个形态），不在 matcher 里内联；
#   - 业务方可用 `guanjin.authz.model-conf` 换成自己的文件（契约 #17），但改它属于改合规基线，
#     须做完整性校验并评审。
#
# 语法以 Casbin 官方为准（基线 §3.4 的 matcher 只是"示意"）。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
# g  : 主体 → 角色（用户持有角色）
# g2 : 资源 → 资源组（RBAC with resource roles）
g = _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && g2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
