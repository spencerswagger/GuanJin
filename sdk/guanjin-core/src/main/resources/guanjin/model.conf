[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj.name == p.obj && r.act == p.act && (r.obj.owner == "" || r.obj.owner == r.sub.name || g(r.sub, "auditor")) && (r.obj.label == 0 || r.sub.clearance >= r.obj.label)
